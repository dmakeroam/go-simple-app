name: Hello

on:
  push:
    branches: [main]
  workflow_dispatch:      # adds a "Run workflow" button in the UI
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello from GitHub Actions"
          echo "Repository: ${{ github.repository }}"
          echo "Commit:     ${{ github.sha }}"
