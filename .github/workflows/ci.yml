name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read      # least privilege by default

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only. On main, let every run finish —
  # cancelling a half-done main build/deploy helps nobody.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true            # caches modules; big speedup

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "These files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build check
        run: go build ./...

  build:
    name: Build and push image
    needs: test                              # only if tests passed
    if: github.event_name == 'push'          # not on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No id-token needed — that permission exists only for OIDC.
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/gitops-app:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image for vulnerabilities
        # Pin third-party Actions to a release tag or commit SHA in production;
        # @master is shown here to match the vendor README, not as best practice.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/gitops-app@${{ steps.push.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'          # fail the job on HIGH or CRITICAL
